<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4forces</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#030814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="4forces">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* tokens + utilities ported from web/src/styles/globals.css */
  :root {
    --abyss: #030814; --deep: #06152f; --trench: #0a1f45;
    --electric: #2868ff; --cyan: #65d9f2; --foam: #eef4ff; --mist: #a9b8d3; --dim: #7f8ca8;
    --line: rgb(169 184 211 / .14);
    --air: #cfdcf2; --land: #9db48a; --stone: #c4b89b; --fire: #ff8a3d; --ember: #ffc061; --flare: #e8513a;
    --sev-none: #4cc38a; --sev-low: #f2d14b; --sev-moderate: #ff9b3d; --sev-severe: #ff4d4d;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --ease-in-out-quint: cubic-bezier(.83, 0, .17, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--abyss); color: var(--foam); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--abyss); overflow-x: clip; font: 16px/1.5 "Inter Tight", ui-sans-serif, system-ui, sans-serif; }
  ::selection { background: rgb(101 217 242 / .35); color: #fff; }
  button, input, textarea, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 4px; }
  .label-sm { font-size: .8125rem; line-height: 1.25rem; font-weight: 500; letter-spacing: -.005em; font-variant-numeric: tabular-nums; }
  .hairline { border-color: var(--line); }
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .9s var(--ease), transform .9s var(--ease); }
  .reveal.is-in { opacity: 1; transform: none; }
  @keyframes pulse-ring { 0% { transform: scale(.6); opacity: .7; } 100% { transform: scale(2.4); opacity: 0; } }
  @keyframes scan { 0% { transform: translateY(-10%); opacity: 0; } 10%, 90% { opacity: 1; } 100% { transform: translateY(110%); opacity: 0; } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
  @keyframes stage-in { from { opacity: 0; clip-path: circle(12% at 50% 60%); filter: blur(6px); } to { opacity: 1; clip-path: circle(120% at 50% 60%); filter: blur(0); } }
  @keyframes pulse { 50% { opacity: .4; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  #app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; background: var(--abyss); }

  /* hero band: brand, orb background, status */
  #hero { position: relative; isolation: isolate; overflow: hidden; padding-top: env(safe-area-inset-top);
    background: radial-gradient(120% 80% at 70% 0%, #0b2266 0%, var(--deep) 45%, var(--abyss) 100%); }
  #orb { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .veil { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(90deg, rgb(3 8 20 / .86) 0%, rgb(3 8 20 / .5) 42%, rgb(3 8 20 / .05) 72%); }
  header { position: relative; z-index: 2; display: flex; align-items: center; height: 56px; padding: 0 16px; }
  .wm { flex: 1; display: inline-flex; align-items: center; font-size: 1.5rem; color: var(--foam); }
  .wm > span { display: inline-flex; align-items: baseline; font-weight: 600; letter-spacing: -.045em; line-height: 1; }
  .eye { width: .74em; height: .74em; margin: 0 .02em; transform: translateY(.03em); align-self: baseline; overflow: visible; }
  #eyes { transform-origin: 50px 50px; transition: transform .16s var(--ease); }
  #eyes ellipse { transition: all .22s; }
  #lang { height: 32px; padding: 0 6px; border-radius: 10px; border: 1px solid rgb(238 244 255 / .15); background: rgb(3 8 20 / .5);
    font-size: 12px; color: var(--foam); cursor: pointer; }
  #lang option { background: var(--deep); }

  #status { position: relative; z-index: 2; margin: 4px 16px 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px;
    background: rgb(6 21 47 / .5); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    transition: border-color .5s, background-color .5s; }
  #status.pop { animation: stage-in .7s var(--ease) both; }
  #status h1 { margin: 0; font-size: clamp(1.9rem, 9vw, 2.6rem); font-weight: 600; line-height: .95; letter-spacing: -.045em; text-wrap: balance; }
  #status p { margin: 10px 0 0; color: var(--mist); font-size: 1rem; line-height: 1.5; }
  #status.alert { border-color: rgb(255 77 77 / .3); background: rgb(255 77 77 / .08); }
  #status.alert h1 { color: var(--sev-severe); }
  #status.maybe { border-color: rgb(255 155 61 / .3); background: rgb(255 155 61 / .08); }
  #status.maybe h1 { color: var(--sev-moderate); }
  #status.ok { border-color: rgb(101 217 242 / .2); background: rgb(101 217 242 / .06); }
  #status.ok h1 { color: var(--sev-none); }

  /* map */
  .mapwrap { position: relative; flex: 1; min-height: 0; border-top: 1px solid var(--line); }
  #map { position: absolute; inset: 0; background: var(--abyss); }
  .leaflet-tile-pane { filter: brightness(.8) sepia(1) hue-rotate(185deg) saturate(1.7); }
  .osm-dark { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }

  /* report pins, same recipe as MiamiMap.tsx: soft halo + core with dark stroke (dashed = unconfirmed) */
  .pin { position: relative; width: 20px; height: 20px; display: grid; place-items: center; }
  .pin::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--c); opacity: .18; }
  .pin::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--c); opacity: 0; }
  .pin.ring::after, .pin.an::after { animation: pulse-ring 2.4s ease-out infinite; }
  .pin b { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--c); border: 1.5px solid var(--abyss); box-sizing: content-box; margin: -1.5px; }
  .pin.unc b { border-style: dashed; }
  .me { position: relative; margin: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--electric); border: 2px solid var(--foam); }
  .me::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; background: var(--electric); animation: pulse-ring 2.4s ease-out infinite; }
  .pick { margin: 1px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--cyan); background: rgb(101 217 242 / .3); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: rgb(6 21 47 / .9); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    color: var(--foam); border: 1px solid var(--line); }
  .leaflet-popup-content-wrapper { border-radius: 16px; }
  .leaflet-popup-content { font-size: 14px; line-height: 1.5; margin: 10px 12px; color: var(--mist); }
  .leaflet-popup-content b { color: var(--foam); font-weight: 600; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--mist); }
  .leaflet-control-attribution { background: rgb(3 8 20 / .7) !important; color: var(--dim) !important; }
  .leaflet-control-attribution a { color: var(--mist) !important; }

  /* chat bubbles: same card as the Assistant response */
  #chat { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 600; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .bub { align-self: flex-start; max-width: 92%; pointer-events: auto; font-size: .95rem; line-height: 1.5; color: var(--mist); padding: 12px 16px;
    border: 1px solid var(--line); border-radius: 16px; background: rgb(6 21 47 / .8);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); animation: stage-in .7s var(--ease) both; }
  .bub.err { color: var(--sev-moderate); border-color: rgb(255 155 61 / .3); }
  .bub b { display: block; font-weight: 500; line-height: 1.3; }
  .bub span.sub { display: block; margin-top: 4px; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--cyan); border-right-color: transparent;
    border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -2px; }

  /* composer: same box as the Assistant input */
  #dock { position: relative; padding: 12px 12px calc(8px + env(safe-area-inset-bottom)); }
  #dock::before { content: ""; position: absolute; left: -8px; right: -8px; bottom: -12px; height: 96px; border-radius: 50%; filter: blur(40px);
    background: radial-gradient(60% 60% at 50% 70%, rgb(40 104 255 / .4), transparent 70%); opacity: .4; transition: opacity .7s; pointer-events: none; }
  #dock:focus-within::before { opacity: 1; }
  #dock.rec::before { background: radial-gradient(60% 60% at 50% 70%, rgb(255 77 77 / .35), transparent 70%); opacity: 1; }
  #box { position: relative; background: rgb(6 21 47 / .8); border: 1px solid rgb(238 244 255 / .15); border-radius: 16px; padding: 8px;
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); transition: border-color .3s; }
  #box:focus-within { border-color: rgb(238 244 255 / .35); }
  #box.rec { border-color: rgb(255 77 77 / .7); }
  #thumbwrap { padding-bottom: 8px; }
  .th { position: relative; display: inline-block; width: 64px; height: 64px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #rm { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%;
    background: rgb(3 8 20 / .75); color: var(--foam); display: grid; place-items: center; cursor: pointer; }
  #rm svg { width: 12px; height: 12px; }
  #textin { display: block; width: 100%; min-height: 44px; max-height: 160px; resize: none; border: 0; background: transparent;
    padding: 10px 8px; color: var(--foam); font-size: 1rem; line-height: 1.5; }
  #textin:focus-visible { outline: none; }
  #textin::-webkit-scrollbar { width: 6px; }
  #textin::-webkit-scrollbar-thumb { background: rgb(169 184 211 / .25); border-radius: 3px; }
  ::placeholder { color: var(--dim); }
  #recui { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0 4px; }
  #timer { display: flex; align-items: center; gap: 8px; font: .8125rem ui-monospace, monospace; color: var(--mist); font-variant-numeric: tabular-nums; }
  #timer i { width: 8px; height: 8px; border-radius: 50%; background: var(--sev-severe); animation: pulse 1s infinite; }
  #bars { display: flex; align-items: center; justify-content: center; gap: 2px; height: 36px; }
  #bars i { width: 2px; border-radius: 2px; background: rgb(101 217 242 / .6); animation: pulse 1s ease-in-out infinite; }
  .actions { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; }
  .rb { width: 44px; height: 44px; border-radius: 12px; border: 0; padding: 0; display: grid; place-items: center; cursor: pointer;
    background: transparent; color: var(--mist); transition: background-color .2s, color .2s, transform .2s; }
  .rb:hover { background: rgb(238 244 255 / .1); color: var(--foam); }
  .rb:active { transform: scale(.95); }
  .rb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #main[data-s=send], #main[data-s=sending] { background: var(--foam); color: var(--abyss); }
  #main[data-s=send]:hover { background: #fff; }
  #main[data-s=sending] { cursor: default; }
  #main[data-s=sending] svg { width: 16px; height: 16px; fill: currentColor; stroke: none; animation: pulse 1s infinite; }
  #main[data-s=rec] { background: rgb(101 217 242 / .2); color: var(--cyan); }
  #box.rec #attach { visibility: hidden; }
  #hint { margin: 10px 0 0; text-align: center; font-size: .8125rem; line-height: 1.25rem; font-weight: 500; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
</style>
</head>
<body>
<div id="app">
  <section id="hero">
    <canvas id="orb" aria-hidden="true"></canvas><div class="veil" aria-hidden="true"></div>
    <header>
      <span class="wm" id="wm" role="img" aria-label="4forces"><span aria-hidden="true"><span>4f</span><svg class="eye" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="37" fill="none" stroke="currentColor" stroke-width="13"/><g id="eyes"><ellipse cx="40" cy="50" rx="5.6" ry="8.5" fill="currentColor"/><ellipse cx="60" cy="50" rx="5.6" ry="8.5" fill="currentColor"/></g></svg><span>rces</span></span></span>
      <select id="lang" aria-label="Language"><option value="en">EN</option><option value="es">ES</option><option value="ht">HT</option></select>
    </header>
    <div id="status" class="ok"><h1></h1><p></p></div>
  </section>
  <div class="mapwrap"><div id="map"></div><div id="chat" aria-live="polite"></div></div>

  <div id="dock">
    <div id="box">
      <div id="thumbwrap" hidden><div class="th"><img id="thumb" alt="">
        <button type="button" id="rm" aria-label="Remove photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>
      <textarea id="textin" rows="1"></textarea>
      <div id="recui" hidden><div id="timer"><i></i><span id="tm">00:00</span></div><div id="bars"></div></div>
      <div class="actions">
        <button type="button" class="rb" id="attach" aria-label="Photo"><svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
        <input type="file" id="photo" accept="image/*" capture="environment" hidden>
        <button type="button" class="rb" id="main" data-s="mic" aria-label="Voice"></button>
      </div>
    </div>
    <p id="hint"></p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// per type: [near you, possible nearby, short noun]
const TYPES = {
  en: { flood: ["Flooding near you", "Possible flooding nearby", "flooding"], fire: ["Fire near you", "Possible fire nearby", "fire"],
    downed_power_line: ["Downed power line near you", "Possible downed power line nearby", "downed power line"],
    downed_tree: ["Downed tree near you", "Possible downed tree nearby", "downed tree"],
    storm_damage: ["Storm damage near you", "Possible storm damage nearby", "storm damage"],
    other: ["Emergency near you", "Possible emergency nearby", "emergency"] },
  es: { flood: ["Inundación cerca de usted", "Posible inundación cerca", "inundación"], fire: ["Incendio cerca de usted", "Posible incendio cerca", "incendio"],
    downed_power_line: ["Cable caído cerca de usted", "Posible cable caído cerca", "cable caído"],
    downed_tree: ["Árbol caído cerca de usted", "Posible árbol caído cerca", "árbol caído"],
    storm_damage: ["Daño por tormenta cerca de usted", "Posible daño por tormenta cerca", "daño por tormenta"],
    other: ["Emergencia cerca de usted", "Posible emergencia cerca", "emergencia"] },
  ht: { flood: ["Inondasyon toupre ou", "Posib inondasyon toupre", "inondasyon"], fire: ["Dife toupre ou", "Posib dife toupre", "dife"],
    downed_power_line: ["Fil kouran tonbe toupre ou", "Posib fil kouran tonbe toupre", "fil kouran tonbe"],
    downed_tree: ["Pyebwa tonbe toupre ou", "Posib pyebwa tonbe toupre", "pyebwa tonbe"],
    storm_damage: ["Domaj tanpèt toupre ou", "Posib domaj tanpèt toupre", "domaj tanpèt"],
    other: ["Ijans toupre ou", "Posib ijans toupre", "ijans"] },
};
const T = {
  en: { textph: "Report flooding: add a photo or describe what you see", hint: "📍 Your location · tap the map to change",
    none: "No flooding near you", nexthigh: "Next high tide", warn: "Don't walk or drive through water", unconf: "Not confirmed yet",
    analyzing: "Analyzing...", unconfirmed: "Unconfirmed", sev: { none: "No", low: "Minor", moderate: "Moderate", severe: "Severe" },
    about: "about", in: "in", cars: "Cars can pass", nocars: "Cars can't pass",
    empty: "Add a photo or text.", noloc: "Location needed. Allow access or tap the map.", sending: "Sending...",
    thanksPhoto: "Checking your photo...", thanks: "Checking your report...", failed: "Couldn't read this report. Please try again.",
    e400: "Add a photo or text.", e413: "Photo too large (max 10 MB).", e502: "AI failed, please try again.", eNet: "Network error, try again.",
    nomic: "Voice not supported here.", listening: "Listening..." },
  es: { textph: "Reporte una inundación: agregue una foto o describa lo que ve", hint: "📍 Su ubicación · toque el mapa para cambiarla",
    none: "Sin inundación cerca de usted", nexthigh: "Próxima marea alta", warn: "No camine ni conduzca por el agua", unconf: "Aún sin confirmar",
    analyzing: "Analizando...", unconfirmed: "Sin confirmar", sev: { none: "Sin", low: "Leve", moderate: "Moderada", severe: "Grave" },
    about: "aprox.", in: "pulg", cars: "Los autos pueden pasar", nocars: "Los autos no pueden pasar",
    empty: "Agregue una foto o texto.", noloc: "Se necesita ubicación. Permita acceso o toque el mapa.", sending: "Enviando...",
    thanksPhoto: "Revisando su foto...", thanks: "Revisando su reporte...", failed: "No pudimos leer este reporte. Intente de nuevo.",
    e400: "Agregue una foto o texto.", e413: "Foto muy grande (máx. 10 MB).", e502: "Falló la IA, intente de nuevo.", eNet: "Error de red, intente de nuevo.",
    nomic: "Voz no disponible aquí.", listening: "Escuchando..." },
  ht: { textph: "Rapòte inondasyon: ajoute yon foto oswa dekri sa ou wè", hint: "📍 Kote ou ye · touche kat la pou chanje l",
    none: "Pa gen inondasyon toupre ou", nexthigh: "Pwochen mare wo", warn: "Pa mache ni kondui nan dlo a", unconf: "Poko konfime",
    analyzing: "Analiz...", unconfirmed: "Pa konfime", sev: { none: "Pa gen", low: "Ti", moderate: "Mwayen", severe: "Grav" },
    about: "anviwon", in: "pous", cars: "Machin ka pase", nocars: "Machin pa ka pase",
    empty: "Ajoute yon foto oswa tèks.", noloc: "Nou bezwen kote ou ye. Pèmèt aksè oswa touche kat la.", sending: "N ap voye...",
    thanksPhoto: "N ap tcheke foto ou...", thanks: "N ap tcheke rapò ou...", failed: "Nou pa t ka li rapò sa a. Tanpri eseye ankò.",
    e400: "Ajoute yon foto oswa tèks.", e413: "Foto twò gwo (maks 10 MB).", e502: "IA a echwe, tanpri eseye ankò.", eNet: "Erè rezo, eseye ankò.",
    nomic: "Vwa pa sipòte isit la.", listening: "N ap koute..." },
};
let lang = localStorage.lang || "en";
const t = k => T[lang][k] ?? T.en[k];
const ty = (type, i) => (TYPES[lang][type] || TYPES[lang].other)[i];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sevColor = s => css("--sev-" + s) || css("--sev-none");
const hhmm = iso => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const RADIUS = 2000;
const dist = (a, b) => { const r = Math.PI / 180, dy = (b.lat - a.lat) * r, dx = (b.lng - a.lng) * r * Math.cos(a.lat * r);
  return 6371000 * Math.hypot(dx, dy); };

// anonymous id so the backend counts one phone as one source
let reporterId = localStorage.reporter_id;
if (!reporterId) { reporterId = "w_" + Math.random().toString(36).slice(2, 10); localStorage.reporter_id = reporterId; }

// --- map ---
const map = L.map("map", { zoomControl: false }).setView([25.7617, -80.1918], 12);
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
const esri = [L.tileLayer(ESRI + "World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 16, maxZoom: 19, attribution: "Esri" }),
  L.tileLayer(ESRI + "World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 16, maxZoom: 19 })];
esri.forEach(l => l.addTo(map));
let tileErrors = 0;
esri.forEach(l => l.on("tileerror", () => {   // Esri unreachable -> plain OSM, darkened with a CSS filter
  if (++tileErrors !== 4) return;
  esri.forEach(x => map.removeLayer(x));
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, className: "osm-dark", attribution: "© OpenStreetMap" }).addTo(map);
}));
const markers = {};
let reports = [], lastAlert = null, lastTide = null, me = null, meMarker = null, repPos = null, pickMarker = null;

const isAnalyzing = r => r.status === "analyzing" || !r.analysis;
const pinIcon = (color, cls) => L.divIcon({ className: "", iconSize: [20, 20], html: `<div class="pin ${cls}" style="--c:${color}"><b></b></div>` });
const dotIcon = cls => L.divIcon({ className: "", iconSize: [18, 18], html: `<div class="${cls}"></div>` });

function popup(r) {
  if (isAnalyzing(r)) return `<b>${t("analyzing")}</b>`;
  const a = r.analysis;
  let h = "";
  if (r.photo_url) h += `<img src="${esc(r.photo_url)}" style="width:180px;border-radius:8px;display:block;margin-bottom:6px">`;
  h += `<b style="color:${sevColor(a.severity)}">${esc(t("sev")[a.severity] || a.severity)} ${esc(ty(a.type, 2))}</b>`;
  if (a.type === "flood" && a.depth_in != null) h += ` · ${t("about")} ${esc(a.depth_in)} ${t("in")}`;
  if (a.type === "flood" && a.car_passable != null) h += `<br>${a.car_passable ? t("cars") : t("nocars")}`;
  if (a.needs_confirmation) h += `<br><span style="color:var(--dim)">${t("unconfirmed")}</span>`;
  return h;
}

function drawReports() {
  const seen = new Set();
  for (const r of reports) {
    seen.add(r.id);
    const an = isAnalyzing(r);
    const a = r.analysis;
    const icon = an ? pinIcon(css("--dim"), "an")
      : pinIcon(sevColor(a.severity), (a.needs_confirmation ? "unc " : "") + (a.severity === "severe" ? "ring" : ""));
    const m = markers[r.id] || (markers[r.id] = L.marker([r.lat, r.lng], { icon }).addTo(map).bindPopup(""));
    m.setIcon(icon); m.setPopupContent(popup(r));
  }
  for (const id in markers) if (!seen.has(id)) { map.removeLayer(markers[id]); delete markers[id]; }
}

// --- status headline (2 km around the user) ---
function drawStatus() {
  const near = p => me && dist(me, p) <= RADIUS;
  const el = $("status"), h = el.querySelector("h1"), p = el.querySelector("p");
  const alert = lastAlert && near(lastAlert) ? lastAlert : null;
  const prev = el.className + h.textContent;
  // ponytail: alerts/reports without a known user location show as "nothing nearby"
  const maybe = reports.filter(r => !isAnalyzing(r) && ["moderate", "severe"].includes(r.analysis.severity) && near(r))
    .sort((a, b) => (b.analysis.severity === "severe") - (a.analysis.severity === "severe"))[0];
  if (alert) {
    el.className = "alert"; h.textContent = ty(alert.type, 0);
    p.textContent = [alert.area, t("warn")].filter(Boolean).join(" · ");
  } else if (maybe) {
    el.className = "maybe"; h.textContent = ty(maybe.analysis.type, 1); p.textContent = t("unconf");
  } else {
    el.className = "ok"; h.textContent = t("none");
    p.textContent = lastTide && lastTide.next_high ? `${t("nexthigh")} ${hhmm(lastTide.next_high.time)}` : "";
  }
  if (prev !== el.className + h.textContent) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
}

// --- polling ---
const get = u => fetch(u).then(r => r.ok ? r.json() : Promise.reject(r.status));
async function poll() {
  const [r, a, d] = await Promise.allSettled([get("/api/reports?hours=24"), get("/api/alerts/latest"), get("/api/tide")]);
  if (r.status === "fulfilled") {
    for (const x of r.value) if (pending[x.id] && x.status !== "analyzing") showResult(x);
    reports = r.value.filter(x => x.status !== "failed");   // failed analyses never show on the map
    drawReports();
  }
  if (a.status === "fulfilled") lastAlert = a.value.alert;
  if (d.status === "fulfilled") lastTide = d.value;
  drawStatus();
}

// --- user location ---
let centered = false;
navigator.geolocation?.watchPosition(p => {
  me = { lat: p.coords.latitude, lng: p.coords.longitude };
  if (meMarker) meMarker.setLatLng([me.lat, me.lng]);
  else meMarker = L.marker([me.lat, me.lng], { icon: dotIcon("me"), interactive: false, zIndexOffset: -500 }).addTo(map);
  if (!centered) { centered = true; map.setView([me.lat, me.lng], 15); }
  if (!pickMarker) repPos = me;
  drawStatus();
}, () => {}, { enableHighAccuracy: true, maximumAge: 10000 });

// --- language ---
function applyLang() {
  document.documentElement.lang = lang;
  $("textin").placeholder = t("textph"); $("hint").textContent = t("hint"); $("lang").value = lang;
  drawReports(); drawStatus();
}
$("lang").onchange = e => { lang = e.target.value; localStorage.lang = lang; applyLang(); };

// --- chat-style report box ---
const ICON = {
  mic: '<svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>',
  send: '<svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 19V5"/></svg>',
  rec: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>',
  sending: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>',
};
const pending = {};   // report id -> bubble element waiting for its analysis
let file = null, recording = false, sending = false, rec = null, recText = "", timerId = null;

function bubble(html, err) {
  const b = document.createElement("div");
  b.className = "bub" + (err ? " err" : ""); b.innerHTML = html;
  $("chat").append(b);
  while ($("chat").children.length > 3) $("chat").firstChild.remove();
  return b;
}
const spin = () => `<span class="spin"></span>`;

function state() {
  const has = $("textin").value.trim() !== "" || !!file;
  const s = sending ? "sending" : recording ? "rec" : has ? "send" : "mic";
  const m = $("main");
  m.dataset.s = s; m.innerHTML = ICON[s]; 
  $("box").classList.toggle("rec", recording); $("dock").classList.toggle("rec", recording);
  $("textin").hidden = recording; $("recui").hidden = !recording;
  $("thumbwrap").hidden = !file || recording;
  $("textin").disabled = sending;
}
function grow() { const x = $("textin"); x.style.height = "auto"; x.style.height = Math.min(x.scrollHeight, 160) + "px"; }
$("textin").oninput = () => { grow(); state(); };
$("textin").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } };

$("attach").onclick = () => $("photo").click();
$("photo").onchange = () => {
  file = $("photo").files[0] || null;
  if (file) $("thumb").src = URL.createObjectURL(file);
  state();
};
$("rm").onclick = () => { file = null; $("photo").value = ""; state(); };

map.on("click", e => {   // tap map to change the report location
  repPos = { lat: e.latlng.lat, lng: e.latlng.lng };
  if (pickMarker) pickMarker.setLatLng(e.latlng);
  else pickMarker = L.marker(e.latlng, { icon: dotIcon("pick"), interactive: false }).addTo(map);
});

// voice -> text with the Web Speech API
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function startRec() {
  if (!SR) return bubble(esc(t("nomic")), true);
  rec = new SR();
  rec.lang = { en: "en-US", es: "es-US", ht: "fr-HT" }[lang];
  rec.continuous = true; recText = "";
  rec.onresult = e => { recText = [...e.results].map(r => r[0].transcript).join(" "); };
  rec.onend = () => stopRec();
  rec.onerror = () => stopRec();
  rec.start(); recording = true;
  $("bars").innerHTML = Array.from({ length: 28 }, (_, i) =>
    `<i style="height:${15 + Math.random() * 85}%;animation-delay:${i * .05}s;animation-duration:${.5 + Math.random() * .5}s"></i>`).join("");
  let sec = 0; $("tm").textContent = "00:00";
  timerId = setInterval(() => { sec++; $("tm").textContent = String(sec / 60 | 0).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0"); }, 1000);
  state();
}
function stopRec() {
  if (!recording) return;
  recording = false; clearInterval(timerId);
  try { rec.stop(); } catch {}
  if (recText.trim()) $("textin").value = ($("textin").value + " " + recText).trim();
  grow(); state();
}

$("main").onclick = () => {
  if (sending) return;
  if (recording) return stopRec();
  if ($("textin").value.trim() || file) submit(); else startRec();
};

async function submit() {
  const text = $("textin").value.trim();
  if (sending || recording || (!text && !file)) return;
  if (!repPos) return bubble(esc(t("noloc")), true);
  const fd = new FormData();
  fd.append("lat", repPos.lat); fd.append("lng", repPos.lng); fd.append("reporter_id", reporterId);
  if (file) fd.append("photo", file);
  if (text) fd.append("text", text);
  const sentPhoto = !!file;
  sending = true; state();
  try {
    const r = await fetch("/api/reports", { method: "POST", body: fd });
    if (!r.ok) return bubble(esc(t({ 400: "e400", 413: "e413", 502: "e502" }[r.status] || "eNet")), true);
    const rep = (await r.json()).report;
    pending[rep.id] = bubble(spin() + " " + esc(t(sentPhoto ? "thanksPhoto" : "thanks")));
    $("textin").value = ""; file = null; $("photo").value = ""; grow();
    if (pickMarker) { map.removeLayer(pickMarker); pickMarker = null; repPos = me; }
    poll();
  } catch { bubble(esc(t("eNet")), true); }
  finally { sending = false; state(); }
}

// turn a finished analysis into a plain-language chat bubble
function showResult(r) {
  const b = pending[r.id]; delete pending[r.id];
  if (r.status === "failed" || !r.analysis) { b.className = "bub err"; b.textContent = t("failed"); return; }
  const a = r.analysis, sum = (a.summary && (a.summary[lang] || a.summary.en)) || "";
  let h = "";
  if (a.type !== "none" && a.is_disaster !== false) {
    h = `<b style="color:${sevColor(a.severity)}">${esc(t("sev")[a.severity] || a.severity)} ${esc(ty(a.type, 2))}`;
    if (a.type === "flood" && a.depth_in != null) h += ` · ${t("about")} ${esc(a.depth_in)} ${t("in")}`;
    h += `</b>`;
  }
  if (sum) h += `<span class="sub">${esc(sum)}</span>`;
  if (a.type === "flood" && a.car_passable != null) h += `<span class="sub">${a.car_passable ? t("cars") : t("nocars")}</span>`;
  b.innerHTML = h || esc(t("failed"));
  b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
}

// --- brand: pointer-following wordmark eyes + animated orb behind the header (ported from EyeMark.tsx / OrbCanvas.tsx) ---
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
(function wordmark() {
  const svg = document.querySelector(".eye"), eyes = $("eyes"), rx = eyes.querySelectorAll("ellipse");
  let look = { x: 0, y: 0 }, blink = false, ry = 8.5;
  const paint = () => { eyes.style.transform = `translate(${look.x}px, ${look.y}px) scaleY(${blink ? .12 : 1})`; };
  const setRy = v => rx.forEach(e => e.setAttribute("ry", v));
  $("wm").onpointerenter = () => setRy(10);
  $("wm").onpointerleave = () => setRy(8.5);
  if (reduced) return;
  let raf = 0, px = 0, py = 0;
  addEventListener("pointermove", e => {
    px = e.clientX; py = e.clientY;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const r = svg.getBoundingClientRect(), dx = px - (r.left + r.width / 2), dy = py - (r.top + r.height / 2);
      const d = Math.hypot(dx, dy) || 1, reach = Math.min(1, d / 260);
      look = { x: dx / d * 7 * reach, y: dy / d * 6 * reach }; paint();
    });
  }, { passive: true });
  (function next() {
    setTimeout(() => { blink = true; paint(); setTimeout(() => { blink = false; paint(); }, 140); next(); }, 2800 + Math.random() * 4200);
  })();
})();

(function orb() {
  const cv = $("orb"), ctx = cv.getContext("2d"), hero = $("hero");
  const A = [40, 104, 255], B = [101, 217, 242], C = [120, 90, 255], ENERGY = .35, SPIN = .25;   // "idle" palette
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;   // deterministic particles
  const parts = Array.from({ length: 60 }, () => ({ a: rnd() * 6.283, rr: 1.08 + rnd() * .5, s: .4 + rnd() * 1.2, z: rnd() }));
  let w = 1, h = 1, last = 0, t0 = performance.now(), blinkAt = 3, blinkT = 0, shown = true;

  function size() {
    const r = hero.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 1.5);
    w = Math.max(1, r.width); h = Math.max(1, r.height);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(4, 0);
  }
  function draw(t, dt) {
    const cx = w * .78, cy = h * .5, R = Math.min(h * .36, w * .24) * (1 + Math.sin(t * 1.15) * .02 * .85);
    ctx.clearRect(0, 0, w, h);
    const halo = ctx.createRadialGradient(cx, cy, R * .6, cx, cy, R * 2.1);
    halo.addColorStop(0, rgba(A, .32 + ENERGY * .15)); halo.addColorStop(.45, rgba(C, .08)); halo.addColorStop(1, rgba(A, 0));
    ctx.fillStyle = halo; ctx.fillRect(0, 0, w, h);
    ctx.save(); ctx.beginPath();
    for (let i = 0; i <= 48; i++) {
      const a = i / 48 * 6.283, wob = 1 + (Math.sin(a * 3 + t * 1.1) * .012 + Math.sin(a * 5 - t * .9) * .008) * (1 + ENERGY * 2);
      ctx[i ? "lineTo" : "moveTo"](cx + Math.cos(a) * R * wob, cy + Math.sin(a) * R * wob);
    }
    ctx.closePath();
    const base = ctx.createRadialGradient(cx - R * .3, cy - R * .4, R * .1, cx, cy, R);
    base.addColorStop(0, "#0d2a7a"); base.addColorStop(1, "#040b22"); ctx.fillStyle = base; ctx.fill(); ctx.clip();
    ctx.globalCompositeOperation = "lighter";
    [[A, .9, 0, .62], [B, 1.3, 2.1, .5], [C, .7, 4.2, .55], [B, 1.7, 1, .32]].forEach(([col, sp, ph, sz], i) => {
      const tt = t * sp * (.3 + SPIN * .4) + ph, bx = cx + Math.cos(tt) * R * .38 + Math.sin(tt * 1.7 + i) * R * .12, by = cy + Math.sin(tt * 1.3) * R * .34;
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, R * sz * (1.4 + ENERGY * .4));
      g.addColorStop(0, rgba(col, .75)); g.addColorStop(1, rgba(col, 0)); ctx.fillStyle = g; ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    });
    ctx.globalCompositeOperation = "source-over";
    blinkT += dt; let open = 1;
    if (!reduced && blinkT > blinkAt) { const ph = (blinkT - blinkAt) / .16; open = ph < 1 ? Math.abs(1 - ph * 2) : 1; if (ph >= 1) { blinkT = 0; blinkAt = 3 + Math.random() * 4; } }
    ctx.fillStyle = "rgba(238,244,255,.85)";
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(cx + sx * R * .17 + Math.sin(t * .4) * R * .04, cy, R * .065, Math.max(.5, R * .11 * open), 0, 0, 6.283); ctx.fill(); }
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.283);
    const rim = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    rim.addColorStop(0, rgba(B, .75)); rim.addColorStop(.5, "rgba(255,255,255,.08)"); rim.addColorStop(1, rgba(C, .5));
    ctx.strokeStyle = rim; ctx.lineWidth = 1.5; ctx.stroke();
    for (const q of parts) {
      q.a += dt * q.s * (.15 + SPIN * .9);
      const x = cx + Math.cos(q.a) * R * q.rr, y = cy + Math.sin(q.a) * R * q.rr * .9, s = 1 + q.z * 1.6;
      ctx.fillStyle = rgba(B, Math.min(1, (.15 + q.z * .5) * (.4 + ENERGY))); ctx.fillRect(x - s / 2, y - s / 2, s, s);
    }
  }
  new ResizeObserver(size).observe(hero);
  if (reduced) return;   // single still frame
  // ponytail: ~30 fps cap, runs only while the hero is on screen and the tab is visible
  new IntersectionObserver(([e]) => { shown = e.isIntersecting; }).observe(hero);
  requestAnimationFrame(function loop(now) {
    requestAnimationFrame(loop);
    if (!shown || document.hidden || now - last < 33) return;
    const dt = Math.min(.1, (now - (last || now)) / 1000); last = now;
    draw((now - t0) / 1000, dt);
  });
})();

// fade the page in like the site's .reveal blocks
[document.querySelector(".mapwrap"), $("dock")].forEach((e, i) => { e.classList.add("reveal"); setTimeout(() => e.classList.add("is-in"), 80 + i * 120); });

applyLang();
state();
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
