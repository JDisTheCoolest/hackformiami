<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4forces</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#030814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="4forces">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* tokens + utilities ported from web/src/styles/globals.css */
  :root {
    --abyss: #030814; --deep: #06152f; --trench: #0a1f45;
    --electric: #2868ff; --cyan: #65d9f2; --foam: #eef4ff; --mist: #a9b8d3; --dim: #7f8ca8;
    --line: rgb(169 184 211 / .14);
    --air: #cfdcf2; --land: #9db48a; --stone: #c4b89b; --fire: #ff8a3d; --ember: #ffc061; --flare: #e8513a;
    --sev-none: #4cc38a; --sev-low: #f2d14b; --sev-moderate: #ff9b3d; --sev-severe: #ff4d4d;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --ease-in-out-quint: cubic-bezier(.83, 0, .17, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--abyss); color: var(--foam); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--abyss); overflow-x: clip; font: 16px/1.5 "Inter Tight", ui-sans-serif, system-ui, sans-serif; }
  ::selection { background: rgb(101 217 242 / .35); color: #fff; }
  button, input, textarea, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 4px; }
  .label-sm { font-size: .8125rem; line-height: 1.25rem; font-weight: 500; letter-spacing: -.005em; font-variant-numeric: tabular-nums; }
  .hairline { border-color: var(--line); }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 50% { opacity: .4; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lbl { margin: 0; font-size: .75rem; font-weight: 500; line-height: 1.2; color: var(--dim); }
  .src { margin: 10px 0 0; font-size: .6875rem; line-height: 1.3; color: var(--dim); font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }

  #app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
    padding-top: env(safe-area-inset-top);
    background: linear-gradient(180deg, var(--trench) 0, var(--abyss) 260px); }   /* the one gradient */
  header { display: flex; align-items: center; height: 52px; padding: 0 16px; }
  .wm { flex: 1; display: inline-flex; align-items: center; font-size: 1.3rem; color: var(--foam); }
  .wm > span { display: inline-flex; align-items: baseline; font-weight: 600; letter-spacing: -.045em; line-height: 1; }
  .eye { width: .74em; height: .74em; margin: 0 .02em; transform: translateY(.03em); align-self: baseline; overflow: visible; }
  #eyes { transform-origin: 50px 50px; transition: transform .16s var(--ease); }
  #eyes ellipse { transition: all .22s; }
  .ib { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent;
    color: var(--foam); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .ib svg, .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  #belldot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--sev-severe); }
  #sub { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px 12px; gap: 8px; font-size: .8125rem; color: var(--mist); }
  #sub p { margin: 0; }
  #live { font-size: .75rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  #live.off { color: var(--sev-moderate); }

  main { position: relative; flex: 1; min-height: 0; }
  .screen { position: absolute; inset: 0; overflow-y: auto; padding: 0 16px 16px; display: none; flex-direction: column; gap: 12px; }
  .screen.on { display: flex; }
  #s-map { padding: 0; }
  h2 { margin: 4px 0 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -.03em; }
  .card, .tidecard, #status, .arow { border: 1px solid var(--line); border-radius: 14px; background: var(--deep); padding: 16px; }

  /* tide */
  .tidecard { --rc: var(--sev-moderate); }
  .tidecard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tidecard .big { margin: 6px 0 0; font-size: 2.5rem; font-weight: 600; letter-spacing: -.04em; line-height: 1; color: var(--rc); }
  .tidecard svg.curve { display: block; width: 100%; height: 64px; margin-top: 12px; overflow: visible; }
  .tidecard .foot { display: flex; justify-content: space-between; margin-top: 6px; font-size: .75rem; color: var(--mist); font-variant-numeric: tabular-nums; }

  /* map card / full map */
  #mapslot { position: relative; height: 230px; flex: none; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  #s-map .mapwrap { border-radius: 0; }
  .mapwrap { position: absolute; inset: 0; }
  #map { position: absolute; inset: 0; background: var(--abyss); }
  .leaflet-tile-pane { filter: brightness(.88) saturate(1.05); }   /* satellite, a touch darker so pins and labels pop */
  .osm-dark { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  #cmap { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  .mapwrap.cz #cmap { opacity: 1; pointer-events: auto; z-index: 2; }
  .mapwrap.cz #map { display: none; }
  #cmap .cesium-viewer, #cmap .cesium-widget { width: 100%; height: 100%; }
  #cmap .cesium-widget-credits { font-size: 9px; }
  #cmap .cesium-credit-textContainer, #cmap .cesium-credit-expand-link { color: var(--dim); }
  #wcard { position: absolute; left: 8px; right: 8px; bottom: 22px; z-index: 700; background: var(--deep); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; animation: fade .3s var(--ease) both; }
  #wcard .txt p { margin: 0; }
  #wcard .big { font-size: 1.375rem; font-weight: 600; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  #wcard .sub { color: var(--mist); font-size: .875rem; margin-top: 2px; }
  #wcard .src { margin-top: 6px; }
  #wx { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--foam); font-size: 18px; line-height: 1; cursor: pointer; }
  #rcount { margin: -4px 2px 0; }
  #rcount p { margin: 0; font-size: .8125rem; color: var(--mist); font-variant-numeric: tabular-nums; }
  #rcount .src { margin-top: 2px; }

  /* nearby status / alerts */
  #status { display: flex; align-items: center; gap: 12px; }
  #status.pop { animation: fade .4s var(--ease) both; }
  .txt { flex: 1; min-width: 0; }
  #status h1, .arow h3 { margin: 6px 0 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
  .arow h3 { font-size: 1.0625rem; margin-top: 0; letter-spacing: -.02em; }
  #status p.sub, .arow p { margin: 4px 0 0; color: var(--mist); font-size: .875rem; line-height: 1.35; }
  .listen { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid rgb(238 244 255 / .25);
    border-radius: 10px; background: transparent; color: var(--foam); font-size: .8125rem; font-weight: 500; cursor: pointer; }
  .listen svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; }
  #status.alert h1, .arow h3 { color: var(--foam); }
  #status.alert h1 { color: var(--sev-severe); }
  #status.maybe h1 { color: var(--sev-moderate); }
  #status.ok h1 { color: var(--sev-none); }
  .arow { display: flex; align-items: center; gap: 12px; }
  .empty { color: var(--dim); text-align: center; padding: 24px 0; font-size: .9rem; }

  .segs { display: flex; gap: 8px; }
  .seg { flex: 1; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--mist); font-weight: 500; cursor: pointer; }
  .seg[aria-pressed=true] { background: var(--foam); border-color: var(--foam); color: var(--abyss); }
  .meid { color: var(--dim); font-size: .75rem; }

  /* tab bar */
  #tabs { position: relative; z-index: 1600; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
    border-top: 1px solid var(--line); background: var(--abyss); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); }
  .tab { background: none; border: 0; padding: 4px 0; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: .6875rem; font-weight: 500; cursor: pointer; }
  .tab[aria-current=page] { color: var(--foam); }
  .fab { justify-self: center; width: 52px; height: 52px; margin-top: -20px; border-radius: 50%; border: 4px solid var(--abyss); padding: 0; display: grid; place-items: center;
    background: var(--foam); color: var(--abyss); cursor: pointer; transition: transform .25s var(--ease); }
  .fab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .fab.open { transform: rotate(45deg); }

  /* report pins: flat halo + core with a dark stroke (dashed = unconfirmed, gray = analyzing) */
  .pin { position: relative; width: 20px; height: 20px; display: grid; place-items: center; }
  .pin::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--c); opacity: .22; }
  .pin b { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--c); border: 1.5px solid var(--abyss); box-sizing: content-box; margin: -1.5px; }
  .pin.unc b { border-style: dashed; }
  .me { margin: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--electric); border: 2px solid var(--foam); }
  .pick { margin: 1px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--foam); background: rgb(238 244 255 / .25); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--deep); color: var(--foam); border: 1px solid var(--line); box-shadow: none; }
  .leaflet-popup-content-wrapper { border-radius: 12px; }
  .leaflet-popup-content { font-size: .875rem; line-height: 1.45; margin: 10px 12px; color: var(--mist); }
  .leaflet-popup-content b { color: var(--foam); font-weight: 600; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--mist); }
  .leaflet-control-attribution { background: rgb(3 8 20 / .75) !important; color: var(--dim) !important; }
  .leaflet-control-attribution a { color: var(--mist) !important; }

  /* report composer */
  #chat { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .bub { align-self: flex-start; max-width: 92%; font-size: .9375rem; line-height: 1.45; color: var(--mist); padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 14px; background: var(--deep); animation: fade .4s var(--ease) both; }
  .bub.err { color: var(--sev-moderate); }
  .bub b { display: block; font-weight: 600; line-height: 1.3; }
  .bub span.sub { display: block; margin-top: 4px; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--mist); border-right-color: transparent;
    border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -2px; }
  #dock { position: absolute; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom)); z-index: 1500; padding: 12px 12px 8px;
    background: var(--abyss); border-top: 1px solid var(--line); animation: fade .3s var(--ease) both; }
  #box { background: var(--deep); border: 1px solid var(--line); border-radius: 14px; padding: 8px; transition: border-color .2s; }
  #box:focus-within { border-color: rgb(238 244 255 / .35); }
  #box.rec { border-color: var(--sev-severe); }
  #thumbwrap { padding-bottom: 8px; }
  .th { position: relative; display: inline-block; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #rm { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%;
    background: rgb(3 8 20 / .8); color: var(--foam); display: grid; place-items: center; cursor: pointer; }
  #rm svg { width: 12px; height: 12px; }
  #textin { display: block; width: 100%; min-height: 44px; max-height: 160px; resize: none; border: 0; background: transparent;
    padding: 10px 8px; color: var(--foam); font-size: 1rem; line-height: 1.5; }
  #textin:focus-visible { outline: none; }
  #textin::-webkit-scrollbar { width: 6px; }
  #textin::-webkit-scrollbar-thumb { background: rgb(169 184 211 / .25); border-radius: 3px; }
  ::placeholder { color: var(--dim); }
  #recui { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0 4px; }
  #timer { display: flex; align-items: center; gap: 8px; font-size: .875rem; color: var(--mist); font-variant-numeric: tabular-nums; }
  #timer i { width: 8px; height: 8px; border-radius: 50%; background: var(--sev-severe); animation: pulse 1s infinite; }
  #bars { display: flex; align-items: center; justify-content: center; gap: 2px; height: 36px; }
  #bars i { width: 2px; border-radius: 2px; background: var(--mist); animation: pulse 1s ease-in-out infinite; }
  .actions { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; }
  .rb { width: 44px; height: 44px; border-radius: 10px; border: 0; padding: 0; display: grid; place-items: center; cursor: pointer;
    background: transparent; color: var(--mist); transition: background-color .2s, color .2s; }
  .rb:hover { background: rgb(238 244 255 / .08); color: var(--foam); }
  .rb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  #main[data-s=send], #main[data-s=sending] { background: var(--foam); color: var(--abyss); }
  #main[data-s=sending] { cursor: default; }
  #main[data-s=sending] svg { width: 16px; height: 16px; fill: currentColor; stroke: none; animation: pulse 1s infinite; }
  #main[data-s=rec] { color: var(--sev-severe); }
  #box.rec #attach { visibility: hidden; }
  #hint { margin: 8px 0 0; text-align: center; font-size: .75rem; line-height: 1.25; color: var(--dim); }
  /* 3D water-level overlay */
  .p3d { display: block; margin-top: 8px; height: 32px; padding: 0 12px; border: 1px solid rgb(238 244 255 / .25); border-radius: 8px;
    background: transparent; color: var(--foam); font-size: .8125rem; font-weight: 500; cursor: pointer; }
  #v3 { position: fixed; inset: 0; z-index: 3000; display: flex; flex-direction: column; background: var(--abyss); animation: fade .3s var(--ease) both; }
  #v3x { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 2; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--deep); color: var(--foam); font-size: 22px; line-height: 1; cursor: pointer; }
  #v3c { position: relative; flex: 1; min-height: 0; }
  #v3c canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #v3c svg.side { position: absolute; inset: 0; margin: auto; width: 100%; max-width: 480px; height: auto; }
  .rise { transform-box: fill-box; transform-origin: bottom; animation: rise 2.2s var(--ease) both; }
  @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  #v3info { padding: 4px 20px calc(18px + env(safe-area-inset-bottom)); max-width: 480px; width: 100%; margin: 0 auto; }
  #v3depth { margin: 0; font-size: clamp(2.6rem, 14vw, 3.6rem); font-weight: 600; letter-spacing: -.045em; line-height: .95; color: var(--foam); }
  #v3line { margin: 8px 0 0; font-size: 1.125rem; font-weight: 500; color: var(--mist); }
  #v3cars { margin: 4px 0 0; color: var(--mist); font-size: .9375rem; }
  #v3cap { margin: 12px 0 0; font-size: .75rem; color: var(--dim); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
</style>
<script src="config.js" onerror="void 0"></script>   <!-- optional, git-ignored: window.CESIUM_TOKEN -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>
<div id="app">
  <header>
    <span class="wm" id="wm" role="img" aria-label="4forces"><span aria-hidden="true"><span>4f</span><svg class="eye" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="37" fill="none" stroke="currentColor" stroke-width="13"/><g id="eyes"><ellipse cx="40" cy="50" rx="5.6" ry="8.5" fill="currentColor"/><ellipse cx="60" cy="50" rx="5.6" ry="8.5" fill="currentColor"/></g></svg><span>rces</span></span></span>
    <button type="button" class="ib" id="bell" aria-label="Alerts"><svg viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg><i id="belldot" hidden></i></button>
  </header>
  <div id="sub"><p id="loc"></p><span id="live" class="off"></span></div>

  <main>
    <section id="s-home" class="screen on">
      <div id="tide" class="tidecard" hidden></div>
      <div id="mapslot"><div class="mapwrap" id="mapwrap"><div id="cmap"></div><div id="map"></div><div id="wcard" hidden><div class="txt"><p class="big" id="wbig"></p><p class="sub" id="wcars"></p><p class="src" id="wcap"></p></div><button type="button" id="wx" aria-label="Close">×</button></div></div></div>
      <div id="rcount"></div>
      <div id="status" class="ok">
        <div class="txt"><p class="lbl" id="slbl"></p><h1></h1><p class="sub"></p><p class="src" id="ssrc"></p></div>
        <button type="button" class="listen" id="listen" hidden><svg viewBox="0 0 24 24"><path d="M6 4l13 8-13 8z"/></svg><span></span></button>
      </div>
    </section>
    <section id="s-map" class="screen"></section>
    <section id="s-alerts" class="screen"><h2 data-t="navAlerts"></h2><div id="alist" style="display:grid;gap:10px"></div></section>
    <section id="s-me" class="screen">
      <h2 data-t="navMe"></h2>
      <div class="card"><p class="meid" data-t="langLabel" style="margin:0 0 10px"></p>
        <div class="segs"><button type="button" class="seg" data-lang="en">EN</button><button type="button" class="seg" data-lang="es">ES</button><button type="button" class="seg" data-lang="ht">HT</button></div></div>
      <p class="meid" id="meid"></p>
    </section>
  </main>

  <div id="dock" hidden>
    <div id="chat" aria-live="polite"></div>
    <div id="box">
      <div id="thumbwrap" hidden><div class="th"><img id="thumb" alt="">
        <button type="button" id="rm" aria-label="Remove photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>
      <textarea id="textin" rows="1"></textarea>
      <div id="recui" hidden><div id="timer"><i></i><span id="tm">00:00</span></div><div id="bars"></div></div>
      <div class="actions">
        <button type="button" class="rb" id="attach" aria-label="Photo"><svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
        <input type="file" id="photo" accept="image/*" capture="environment" hidden>
        <button type="button" class="rb" id="main" data-s="mic" aria-label="Voice"></button>
      </div>
    </div>
    <p id="hint"></p>
  </div>

  <nav id="tabs">
    <button type="button" class="tab" data-go="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-t="navHome"></span></button>
    <button type="button" class="tab" data-go="map"><svg viewBox="0 0 24 24"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15M9 3.236v15"/></svg><span data-t="navMap"></span></button>
    <button type="button" class="fab" id="fab" aria-label="Report"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// per type: [near you, possible nearby, short noun]
const TYPES = {

};
const T = {
  en: { ofwater: "of water", wcap: "Water level is an approximate illustration from the AI estimate.",

    navHome: "Home", navMap: "Map", navAlerts: "Alerts", navMe: "Me", langLabel: "Language", tideRisk: "Tide risk", king: "King-tide window", now: "Now", high: "High", riskw: { low: "Low", elevated: "Elevated", high: "High" }, reports24: "reports · 24 h", listen: "Listen", noAlerts: "No alerts yet.", neighbors: "neighbor reports", ago: "min ago", test: "test alert", live: "Live", offline: "Offline", yourLoc: "Your location", miami: "Miami, Florida", reporter: "Reporter ID",

    analyzing: "Analyzing...", unconfirmed: "Unconfirmed", sev: { none: "No", low: "Minor", moderate: "Moderate", severe: "Severe" },
    about: "about", in: "in", cars: "Cars can pass", nocars: "Cars can't pass",
    empty: "Add a photo or text.", noloc: "Location needed. Allow access or tap the map.", sending: "Sending...",
    thanksPhoto: "Checking your photo...", thanks: "Checking your report...", failed: "Couldn't read this report. Please try again.",
    e400: "Add a photo or text.", e413: "Photo too large (max 10 MB).", e502: "AI failed, please try again.", eNet: "Network error, try again.",
    nomic: "Voice not supported here.", listening: "Listening..." },
  es: { ofwater: "de agua", wcap: "El nivel del agua es una ilustración aproximada de la estimación de la IA.",
    updated: "actualizado", r2km: "Cerca de usted · 2 km", lowT: "Baja", srcN: "Reportes de vecinos", srcT: "NOAA",
    view3d: "Nivel del agua en 3D", illus: "Ilustración basada en una estimación de profundidad de la IA, no en un levantamiento.", lvls: ["Debajo del borde de la acera", "Sobre el borde de la acera", "A media altura de las ruedas", "A la altura de las puertas del auto", "A la altura de la rodilla"], close: "Cerrar",
    navHome: "Inicio", navMap: "Mapa", navAlerts: "Alertas", navMe: "Yo", langLabel: "Idioma", tideRisk: "Riesgo de marea", king: "Marea viva", now: "Ahora", high: "Alta", riskw: { low: "Bajo", elevated: "Elevado", high: "Alto" }, reports24: "reportes · 24 h", listen: "Escuchar", noAlerts: "Aún no hay alertas.", neighbors: "reportes de vecinos", ago: "min", test: "alerta de prueba", live: "En vivo", offline: "Sin conexión", yourLoc: "Su ubicación", miami: "Miami, Florida", reporter: "ID de reportero",
    textph: "Reporte una inundación: agregue una foto o describa lo que ve", hint: "Usando su ubicación · toque el mapa para cambiarla",
    none: "Sin inundación cerca de usted", nexthigh: "Próxima marea alta", warn: "No camine ni conduzca por el agua", unconf: "Aún sin confirmar",
    analyzing: "Analizando...", unconfirmed: "Sin confirmar", sev: { none: "Sin", low: "Leve", moderate: "Moderada", severe: "Grave" },
    about: "aprox.", in: "pulg", cars: "Los autos pueden pasar", nocars: "Los autos no pueden pasar",
    empty: "Agregue una foto o texto.", noloc: "Se necesita ubicación. Permita acceso o toque el mapa.", sending: "Enviando...",
    thanksPhoto: "Revisando su foto...", thanks: "Revisando su reporte...", failed: "No pudimos leer este reporte. Intente de nuevo.",
    e400: "Agregue una foto o texto.", e413: "Foto muy grande (máx. 10 MB).", e502: "Falló la IA, intente de nuevo.", eNet: "Error de red, intente de nuevo.",
    nomic: "Voz no disponible aquí.", listening: "Escuchando..." },
  ht: { ofwater: "dlo", wcap: "Nivo dlo a se yon ilistrasyon apwoksimatif ki soti nan estimasyon IA a.",
    updated: "mizajou", r2km: "Toupre ou · 2 km", lowT: "Ba", srcN: "Rapò vwazen", srcT: "NOAA",
    view3d: "Nivo dlo an 3D", illus: "Ilistrasyon ki baze sou estimasyon pwofondè IA a, se pa yon mezi egzak.", lvls: ["Anba trotwa a", "Anwo trotwa a", "Mwatye wou yo", "Nan pòt machin yo", "Jiska jenou"], close: "Fèmen",
    navHome: "Akèy", navMap: "Kat", navAlerts: "Alèt", navMe: "Mwen", langLabel: "Lang", tideRisk: "Risk mare", king: "Mare vivan", now: "Kounye a", high: "Wo", riskw: { low: "Ba", elevated: "Wo", high: "Trè wo" }, reports24: "rapò · 24 è", listen: "Koute", noAlerts: "Poko gen alèt.", neighbors: "rapò vwazen", ago: "min", test: "alèt tès", live: "An dirèk", offline: "Dekonekte", yourLoc: "Kote ou ye", miami: "Miami, Florid", reporter: "ID rapòtè",
    textph: "Rapòte inondasyon: ajoute yon foto oswa dekri sa ou wè", hint: "Ap itilize kote ou ye · touche kat la pou chanje l",
    none: "Pa gen inondasyon toupre ou", nexthigh: "Pwochen mare wo", warn: "Pa mache ni kondui nan dlo a", unconf: "Poko konfime",
    analyzing: "Analiz...", unconfirmed: "Pa konfime", sev: { none: "Pa gen", low: "Ti", moderate: "Mwayen", severe: "Grav" },
    about: "anviwon", in: "pous", cars: "Machin ka pase", nocars: "Machin pa ka pase",
    empty: "Ajoute yon foto oswa tèks.", noloc: "Nou bezwen kote ou ye. Pèmèt aksè oswa touche kat la.", sending: "N ap voye...",
    thanksPhoto: "N ap tcheke foto ou...", thanks: "N ap tcheke rapò ou...", failed: "Nou pa t ka li rapò sa a. Tanpri eseye ankò.",
    e400: "Ajoute yon foto oswa tèks.", e413: "Foto twò gwo (maks 10 MB).", e502: "IA a echwe, tanpri eseye ankò.", eNet: "Erè rezo, eseye ankò.",
    nomic: "Vwa pa sipòte isit la.", listening: "N ap koute..." },
};
let lang = localStorage.lang || "en";
const t = k => T[lang][k] ?? T.en[k];
const ty = (type, i) => (TYPES[lang][type] || TYPES[lang].other)[i];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sevColor = s => css("--sev-" + s) || css("--sev-none");
const hhmm = iso => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const RADIUS = 2000;
const dist = (a, b) => { const r = Math.PI / 180, dy = (b.lat - a.lat) * r, dx = (b.lng - a.lng) * r * Math.cos(a.lat * r);
  return 6371000 * Math.hypot(dx, dy); };

// anonymous id so the backend counts one phone as one source
let reporterId = localStorage.reporter_id;
if (!reporterId) { reporterId = "w_" + Math.random().toString(36).slice(2, 10); localStorage.reporter_id = reporterId; }

// --- map ---
const map = L.map("map", { zoomControl: false }).setView([25.7617, -80.1918], 12);
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const esri = [  // satellite imagery + street and place names on top
  L.tileLayer(ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 19, attribution: "Esri, Maxar, Earthstar Geographics" }),
  L.tileLayer(ESRI + "Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 19 }),
  L.tileLayer(ESRI + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 19 })];
map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');   // default prefix carries a flag emoji
esri.forEach(l => l.addTo(map));
let tileErrors = 0;
esri.forEach(l => l.on("tileerror", () => {   // Esri unreachable -> plain OSM, darkened with a CSS filter
  if (++tileErrors !== 4) return;
  esri.forEach(x => map.removeLayer(x));
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, className: "osm-dark", attribution: "© OpenStreetMap" }).addTo(map);
}));
const markers = {};
let reports = [], lastAlert = null, lastTide = null, me = null, meMarker = null, repPos = null, pickMarker = null;

const isAnalyzing = r => r.status === "analyzing" || !r.analysis;
const pinIcon = (color, cls) => L.divIcon({ className: "", iconSize: [20, 20], html: `<div class="pin ${cls}" style="--c:${color}"><b></b></div>` });
const dotIcon = cls => L.divIcon({ className: "", iconSize: [18, 18], html: `<div class="${cls}"></div>` });

function popup(r) {
  if (isAnalyzing(r)) return `<b>${t("analyzing")}</b>`;
  const a = r.analysis;
  let h = "";
  if (r.photo_url) h += `<img src="${esc(r.photo_url)}" style="width:180px;border-radius:8px;display:block;margin-bottom:6px">`;
  h += `<b style="color:${sevColor(a.severity)}">${esc(t("sev")[a.severity] || a.severity)} ${esc(ty(a.type, 2))}</b>`;
  if (a.type === "flood" && a.depth_in != null) h += ` · ${t("about")} ${esc(a.depth_in)} ${t("in")}`;
  if (a.type === "flood" && a.car_passable != null) h += `<br>${a.car_passable ? t("cars") : t("nocars")}`;
  if (a.needs_confirmation) h += `<br><span style="color:var(--dim)">${t("unconfirmed")}</span>`;
  if (a.type === "flood" && a.depth_in != null) h += `<button type="button" class="p3d" data-id="${esc(r.id)}">${t("view3d")}</button>`;
  return h;
}

function drawReports() {
  const seen = new Set();
  for (const r of reports) {
    seen.add(r.id);
    const an = isAnalyzing(r);
    const a = r.analysis;
    const icon = an ? pinIcon(css("--dim"), "an")
      : pinIcon(sevColor(a.severity), (a.needs_confirmation ? "unc " : "") + (a.severity === "severe" ? "ring" : ""));
    const m = markers[r.id] || (markers[r.id] = L.marker([r.lat, r.lng], { icon }).addTo(map).bindPopup(""));
    m.setIcon(icon); m.setPopupContent(popup(r));
  }
  for (const id in markers) if (!seen.has(id)) { map.removeLayer(markers[id]); delete markers[id]; }
  czDraw();
}

// --- status card (2 km around the user) ---
let listenAlert = null, allAlerts = [], online = false, updatedAt = null;
const mins = iso => Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));

function drawStatus() {
  const near = p => me && dist(me, p) <= RADIUS;
  const el = $("status"), h = el.querySelector("h1"), p = el.querySelector(".sub");
  const alert = lastAlert && near(lastAlert) ? lastAlert : null;
  const prev = el.className + h.textContent;
  // ponytail: alerts/reports without a known user location show as "nothing nearby"
  const maybe = reports.filter(r => !isAnalyzing(r) && ["moderate", "severe"].includes(r.analysis.severity) && near(r))
    .sort((a, b) => (b.analysis.severity === "severe") - (a.analysis.severity === "severe"))[0];
  let src = "";
  if (alert) {
    el.className = "alert"; h.textContent = ty(alert.type, 0);
    p.textContent = [alert.area, t("warn")].filter(Boolean).join(" · ");
    src = `4forces · ${alert.count} ${t("neighbors")} · ${mins(alert.created_at)} ${t("ago")}${alert.test ? " · " + t("test") : ""}`;
  } else if (maybe) {
    el.className = "maybe"; h.textContent = ty(maybe.analysis.type, 1); p.textContent = t("unconf");
    src = `${t("srcN")} · ${maybe.area || ""}${maybe.area ? " · " : ""}${mins(maybe.created_at)} ${t("ago")}`;
  } else {
    el.className = "ok"; h.textContent = t("none");
    p.textContent = lastTide && lastTide.next_high ? `${t("nexthigh")} ${hhmm(lastTide.next_high.time)}` : "";
    src = lastTide ? `${t("srcT")} · ${lastTide.station.split(",")[0]}` : "";
  }
  $("slbl").textContent = t("r2km"); $("ssrc").textContent = src;
  listenAlert = alert; $("listen").hidden = !alert;
  if (prev !== el.className + h.textContent) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
}

// read an alert out loud in the chosen language (browser speech synthesis)
function speak(a) {
  if (!window.speechSynthesis || !a) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(a.message[lang] || a.message.en);
  u.lang = { en: "en-US", es: "es-US", ht: "fr-FR" }[lang];   // no Haitian Creole voice in browsers; French is the closest
  speechSynthesis.speak(u);
}
$("listen").onclick = () => speak(listenAlert);

function drawTide() {
  const d = lastTide, el = $("tide");
  el.hidden = !d;
  if (!d) return;
  el.style.setProperty("--rc", css({ low: "--sev-none", elevated: "--sev-moderate", high: "--sev-severe" }[d.risk] || "--sev-moderate"));
  const up = d.upcoming || [], pts = up.slice(0, 5).map(x => ({ t: +new Date(x.time), h: x.height_ft }));
  let curve = "";
  if (pts.length > 1) {
    const W = 300, H = 64, t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    const lo = Math.min(...pts.map(x => x.h)), hi = Math.max(...pts.map(x => x.h));
    const X = x => (x.t - t0) / (t1 - t0 || 1) * W, Y = x => H - 6 - (x.h - lo) / (hi - lo || 1) * (H - 14);
    let path = `M${X(pts[0])},${Y(pts[0])}`;
    for (let i = 1; i < pts.length; i++) { const m = (X(pts[i - 1]) + X(pts[i])) / 2; path += ` C${m},${Y(pts[i - 1])} ${m},${Y(pts[i])} ${X(pts[i])},${Y(pts[i])}`; }
    const nx = Math.min(W, Math.max(0, (Date.now() - t0) / (t1 - t0 || 1) * W));
    curve = `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${path}" fill="none" stroke="var(--rc)" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
      <line x1="${nx}" x2="${nx}" y1="0" y2="${H}" stroke="rgb(238 244 255 / .4)" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/></svg>`;
  }
  const low = up.find(x => x.type === "L");
  el.innerHTML = `<div class="top"><p class="lbl">${t("tideRisk")}</p>${d.king_tide_window ? `<p class="lbl">${t("king")}</p>` : ""}</div>
    <p class="big">${esc(t("riskw")[d.risk] || d.risk)}</p>${curve}
    <div class="foot"><span>${low ? `${t("lowT")} ${hhmm(low.time)} · ${Number(low.height_ft).toFixed(2)} ft` : t("now")}</span><span>${d.next_high ? `${t("high")} ${hhmm(d.next_high.time)} · ${Number(d.next_high.height_ft).toFixed(2)} ft` : ""}</span></div>
    <p class="src">${t("srcT")} · ${esc(d.station)} · ${t("updated")} ${hhmm(d.updated_at)}${d.stale ? " · stale" : ""}</p>`;
}

function drawAlerts() {
  $("belldot").hidden = !lastAlert;
  $("alist").innerHTML = allAlerts.length ? allAlerts.map((a, i) => `<div class="arow"><div class="txt"><h3>${esc(ty(a.type, 2))}${a.area ? " · " + esc(a.area) : ""}</h3>
    <p class="num">${a.count} ${t("neighbors")} · ${mins(a.created_at)} ${t("ago")}${a.test ? " · " + t("test") : ""}</p></div>
    <button type="button" class="listen" data-i="${i}"><svg viewBox="0 0 24 24"><path d="M6 4l13 8-13 8z"/></svg><span>${t("listen")}</span></button></div>`).join("")
    : `<p class="empty">${t("noAlerts")}</p>`;
}
$("alist").onclick = e => { const b = e.target.closest("[data-i]"); if (b) speak(allAlerts[b.dataset.i]); };

function drawChrome() {
  const n = c => reports.filter(r => !isAnalyzing(r) && r.analysis.severity === c).length;
  const sev = ["severe", "moderate", "low"].map(c => [n(c), c]).filter(x => x[0]).map(x => `${x[0]} ${t("sev")[x[1]].toLowerCase()}`).join(", ");
  $("rcount").innerHTML = `<p>${reports.length} ${t("reports24")}${sev ? " · " + sev : ""}</p><p class="src">${t("srcN")} · ${t("updated")} ${updatedAt ? hhmm(updatedAt) : "–"}</p>`;
  $("loc").textContent = me ? t("yourLoc") : t("miami");
  $("live").className = online ? "" : "off";
  $("live").textContent = online ? `${t("live")} · ${updatedAt ? hhmm(updatedAt) : ""}` : t("offline");
  $("meid").textContent = `${t("reporter")}: ${reporterId}`;
  $("listen").lastElementChild.textContent = t("listen");
}

// --- polling ---
const get = u => fetch(u).then(r => r.ok ? r.json() : Promise.reject(r.status));
async function poll() {
  const [r, a, d, all] = await Promise.allSettled([get("/api/reports?hours=24"), get("/api/alerts/latest"), get("/api/tide"), get("/api/alerts")]);
  online = r.status === "fulfilled" || a.status === "fulfilled";
  if (online) updatedAt = new Date();
  if (r.status === "fulfilled") {
    for (const x of r.value) if (pending[x.id] && x.status !== "analyzing") showResult(x);
    reports = r.value.filter(x => x.status !== "failed");   // failed analyses never show on the map
    drawReports();
  }
  if (a.status === "fulfilled") lastAlert = a.value.alert;
  if (d.status === "fulfilled") lastTide = d.value;
  if (all.status === "fulfilled") allAlerts = all.value;
  drawStatus(); drawTide(); drawAlerts(); drawChrome();
}

// --- user location ---
let centered = false;
navigator.geolocation?.watchPosition(p => {
  me = { lat: p.coords.latitude, lng: p.coords.longitude };
  if (meMarker) meMarker.setLatLng([me.lat, me.lng]);
  else meMarker = L.marker([me.lat, me.lng], { icon: dotIcon("me"), interactive: false, zIndexOffset: -500 }).addTo(map);
  if (!centered) { centered = true; map.setView([me.lat, me.lng], 15); czHome(); }
  if (!pickMarker) repPos = me;
  drawStatus(); drawChrome();
}, () => {}, { enableHighAccuracy: true, maximumAge: 10000 });

// --- language ---
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("textin").placeholder = t("textph"); $("hint").textContent = t("hint");
  drawReports(); drawStatus(); drawTide(); drawAlerts(); drawChrome();
}
document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; localStorage.lang = lang; applyLang(); });

// --- tabs, report dock ---
function openDock(on) { $("dock").hidden = !on; $("fab").classList.toggle("open", on); }
function show(name) {
  for (const x of ["home", "map", "alerts", "me"]) $("s-" + x).classList.toggle("on", x === name);
  document.querySelectorAll(".tab").forEach(b => b.toggleAttribute("aria-current", b.dataset.go === name));
  document.querySelectorAll(".tab[aria-current]").forEach(b => b.setAttribute("aria-current", "page"));

    await loadScript(CESIUM + "Cesium.js");
    const C = window.Cesium; C.Ion.defaultAccessToken = window.CESIUM_TOKEN;
    viewer = new C.Viewer("cmap", { globe: false, baseLayer: false, requestRenderMode: true, maximumRenderTimeChange: Infinity,
      timeline: false, animation: false, geocoder: false, baseLayerPicker: false, homeButton: false, sceneModePicker: false,
      navigationHelpButton: false, fullscreenButton: false, vrButton: false, infoBox: false, selectionIndicator: false, shouldAnimate: false });
    viewer.scene.skyBox.show = false; viewer.scene.backgroundColor = C.Color.fromCssColorString("#030814");
    viewer.resolutionScale = Math.min(devicePixelRatio || 1, 2);
    const tiles = await C.createGooglePhotorealistic3DTileset();
    if (done) return;
    if (matchMedia("(max-width: 700px)").matches) tiles.maximumScreenSpaceError = 16;   // lighter on phones
    viewer.scene.primitives.add(tiles);
    cz = { C, viewer, ents: {}, tick: 0, live: false };
    czHome();
    await new Promise((ok, no) => { tiles.initialTilesLoaded.addEventListener(ok); tiles.tileFailed.addEventListener(e => { if (cz && !cz.live && /40[13]/.test(String(e && e.message))) no(e.message); }); viewer.scene.requestRender(); });
    if (done) return;
    clearTimeout(timer); done = true; cz.live = true;
    $("mapwrap").classList.add("cz");   // reveal Cesium, hide Leaflet
    viewer.resize(); czDraw(); czMe();
    setInterval(() => { if (cz && reports.some(isAnalyzing)) { cz.tick ^= 1; czDraw(); } }, 700);   // gray pins pulse
    new C.ScreenSpaceEventHandler(viewer.scene.canvas).setInputAction(async e => {
      const hit = viewer.scene.pick(e.position);
      if (hit && hit.id && hit.id.reportId) return czSelect(reports.find(x => x.id === hit.id.reportId));
      if ($("dock").hidden || !viewer.scene.pickPositionSupported) return;
      const pos = viewer.scene.pickPosition(e.position);
      if (!pos) return;
      const g = C.Cartographic.fromCartesian(pos);
      setPick(C.Math.toDegrees(g.latitude), C.Math.toDegrees(g.longitude));
    }, C.ScreenSpaceEventType.LEFT_CLICK);
  } catch (e) { clearTimeout(timer); fail(e && e.message || e); }
}
setTimeout(startCesium, 0);

applyLang();
state();
poll();
setInterval(poll, 5000);
</script>
